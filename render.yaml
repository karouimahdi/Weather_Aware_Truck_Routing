services:
  - type: web
    name: weather-aware-truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/schema/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
